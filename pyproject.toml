[project]
name = "tiny-agent"
version = "0.1.0"
description = "Implementation of TinyAgent from An Illustrated Guide to AI Agents"
readme = "README.md"
authors = [
    { name = "Mike Wild", email = "wildconsultingltd@googlemail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "rich>=15.0.0",
]

[project.scripts]
tiny-agent = "tiny_agent:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
